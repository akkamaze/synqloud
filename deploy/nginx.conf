server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Build output names carry a content hash, so they never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
